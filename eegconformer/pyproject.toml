[project]
name = "eegconformer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pytest>=7.0.0",
]

[tool.uv]
# Install PyTorch with CUDA 12.1 support (for RTX 3090)
# Run: uv sync --extra-index-url https://download.pytorch.org/whl/cu121
extra-index-url = ["https://download.pytorch.org/whl/cu121"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
