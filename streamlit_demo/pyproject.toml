[project]
name = "streamlit-demo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35",
    "plotly>=5.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pytest>=7.0.0",
    "matplotlib>=3.10.9",
]

[tool.uv]
# CPU-only torch is sufficient for demo inference.
# For GPU server: uncomment the line below and run: uv sync
# extra-index-url = ["https://download.pytorch.org/whl/cu121"]
